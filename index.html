<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3e10c"><title>SH&W Chapter Matching Game</title><link rel="stylesheet" href="styles.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><header><div class="brand">AIRBUS <button id="settingsButton" class="icon" aria-label="Open settings">⚙</button></div><span>SH&W · LEARN THROUGH PLAY</span></header><main id="app" tabindex="-1"><p>Preparing your game…</p></main><div id="announcement" class="sr" role="status" aria-live="polite"></div><div id="toast" role="status"></div>
<dialog id="settings"><form id="unlockForm"><div class="spread"><h2>Game settings</h2><button type="button" class="icon closeSettings" aria-label="Close settings">✕</button></div><p>Enter the settings password to change the game duration.</p><label for="password">Password</label><div class="password"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="eye" class="icon" aria-label="Show password" aria-pressed="false">◉</button></div><p id="passwordError" class="error" role="alert"></p><button class="primary">Unlock settings</button></form>
<form id="timerForm" hidden><div class="spread"><h2>Set your timer</h2><button type="button" class="icon closeSettings" aria-label="Close settings">✕</button></div><label for="minutes">Duration in minutes</label><input id="minutes" type="number" min="1" max="120" step="1" required><p>Saved on this device for future games. A game already in progress keeps its original timer.</p><button class="primary">Save duration</button></form><hr><h3>Sound</h3><label class="check"><input id="music" type="checkbox"> Background music</label><label class="check"><input id="effects" type="checkbox"> Sound effects</label></dialog>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="confirmNo">Keep playing</button><button id="confirmYes" class="primary">Confirm</button></div></dialog>
</body></html>
